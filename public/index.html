  window.addEventListener('load', function() {
    window.NABZ.openMarInteractive = function(patientId) {
      var b = document.querySelector('.bs-backdrop');
      if (b) b.remove();
      if (!patientId) return;
      try { history.replaceState(null, '', '/kind/mar_patient?patientId=' + encodeURIComponent(patientId)); } catch(_) {}
      if (typeof window.NABZ.show === 'function') window.NABZ.show('mar_patient', { patientId: patientId });
    };
  });
</script>
